[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-dictionary-pursuit"
version = "1.0.0"
description = "Beyond the Grid: Continuous Dictionary Pursuit for Interpretable Signal Decomposition (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Nick Janssen", email = "janssen@tnt.uni-hannover.de" },
]
dependencies = [
    "torch>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "einops>=0.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
baselines = [
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "prophet>=1.1",
]

[tool.setuptools.packages.find]
include = ["src*"]
